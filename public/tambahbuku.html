<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/output.css">
</head>
<body>
    <h1>Tambah Data Buku</h1>

    <form class="w-[25%] rounded-xl bg-gray-300 p-5 m-5 flex flex-col" action="/buku/tambah" method="POST"> 
    <label for="id">Id</label> 
    <input class="border-2 border-amber-300" type="text" id="id" name="id" required><br> 
    
    <label style="width: 100px !important;" for="judul">judul:</label> 
    <input class="border-2 border-amber-300" type="text" id="judul" name="judul" required><br> 
    
    <label style="width: 100px !important;" for="kategori">Kategori:</label> 
    <select class="border-2 border-amber-300 bg-white" id="kategori" name="kategori" required>
        <option value="" disabled selected>-- Pilih Kategori --</option>
        <option value="Pertempuran Panas">Pertempuran Panas</option>
        <option value="Biologi">Biologi</option>
        <option value="NgawiFlix">NgawiFlix</option>
        <option value="BomBoClat">BomBoClat</option>
    </select><br> 
    
    <label style="width: 100px !important;" for="penulis">Penulis:</label> 
    <input class="border-2 border-amber-300" type="text" id="penulis" name="penulis" required><br> 
    
    <label style="width: 100px !important;" for="tahunterbit">Tahun Terbit:</label> 
    <input class="border-2 border-amber-300" type="number" id="tahunterbit" name="tahun_terbit" required><br> 
    
    <label style="width: 100px !important;" for="isbn">ISBN:</label> 
    <input class="border-2 border-amber-300" type="text" id="isbn" name="isbn" required><br> 
    
    <button class="p-2 m-2 bg-green-400" type="submit">Tambah Buku</button> 
</form>
</body>
</html>
